# Serves the static export: /foo → foo.html, /foo/ redirects to /foo, directories are never listed. Runs behind a
# TLS-terminating proxy, so redirects stay relative. No access log (the privacy page promises none).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log off;
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/rss+xml;

    location / {
        rewrite ^(/.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    error_page 404 /404.html;
}
