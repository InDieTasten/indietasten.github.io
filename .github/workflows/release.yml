name: Release

# main -> ghcr.io/indietasten/homepage:sha-<short> and :edge, then the lab redeploys the homepage stack at
# https://indietasten.net; this run fails if it doesn't come up (shared image.yml of InDieTasten/.github).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    uses: InDieTasten/.github/.github/workflows/image.yml@main
    with:
      image: homepage
      stack: homepage
      url: https://indietasten.net
