name: Release

# main → images ghcr.io/indietasten/homepage:sha-<short> and :edge. The lab (InDieTasten/lab, stack "homepage")
# tracks :edge with Komodo auto_update, which redeploys it at https://indietasten.net. No PR into the lab needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/indietasten/homepage

jobs:
  image:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://indietasten.net
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:edge
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

