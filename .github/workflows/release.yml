name: Release

# main → images ghcr.io/indietasten/homepage:sha-<short> and :edge, then a tag-bump PR in InDieTasten/lab (merged
# right away) whose push makes the lab deploy it at https://indietasten.net.
# LAB_BUMP_TOKEN: fine-grained PAT, InDieTasten/lab only, contents + pull requests write.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/indietasten/homepage

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    environment:
      name: production
      url: https://indietasten.net
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:edge
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-lab:
    needs: image
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: InDieTasten/lab
          token: ${{ secrets.LAB_BUMP_TOKEN }}
          path: lab
      - name: Bump the image tag
        run: |
          f=lab/stacks/homepage/compose.yaml
          sed -i -E "s|(image: ${IMAGE}:)[A-Za-z0-9._-]+|\1${TAG}|" "$f"
          grep -q "image: ${IMAGE}:${TAG}" "$f"
      - id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          path: lab
          token: ${{ secrets.LAB_BUMP_TOKEN }}
          branch: bump/homepage
          delete-branch: true
          sign-commits: true
          commit-message: |
            chore(homepage): ${{ env.TAG }}

            ${{ github.repository }}@${{ github.sha }}
          title: "chore(homepage): ${{ env.TAG }}"
          body: "Deploys ${{ github.repository }}@${{ github.sha }} (`${{ env.IMAGE }}:${{ env.TAG }}`)."
      - name: Merge
        if: steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.LAB_BUMP_TOKEN }}
        run: gh pr merge --repo InDieTasten/lab "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch

